name: Dependabot Auto-Merge
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dependabot-policy:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    outputs:
      is_dependabot: ${{ steps.evaluate.outputs.is_dependabot }}
      auto_merge_allowed: ${{ steps.evaluate.outputs.auto_merge_allowed }}
    steps:
      - name: Evaluate Dependabot policy
        id: evaluate
        uses: frasermolyneux/actions/dependabot-policy@dependabot-policy/v1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
  dependabot:
    needs:
      - dependabot-policy
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: ${{ needs.dependabot-policy.outputs.is_dependabot == 'true' && needs.dependabot-policy.outputs.auto_merge_allowed == 'true' }}
    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  refresh-dependabot-branches:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    concurrency:
      group: dependabot-branch-refresh
      cancel-in-progress: false
    steps:
      - name: Refresh approved Dependabot PRs behind main
        shell: bash
        run: |
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --author "app/dependabot" \
            --limit 100 \
            --json number,autoMergeRequest,mergeStateStatus,headRefOid \
            --jq '.[] | select(.autoMergeRequest != null and .mergeStateStatus == "BEHIND") | [.number, .headRefOid] | @tsv' |
          while IFS=$'\t' read -r number head_sha; do
            gh api \
              --method PUT \
              "repos/$GITHUB_REPOSITORY/pulls/$number/update-branch" \
              -f expected_head_sha="$head_sha"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
