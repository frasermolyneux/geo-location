name: Build and Test

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"

permissions: {}

jobs:
  detect-changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.changes.outputs.src }}
      terraform: ${{ steps.changes.outputs.terraform }}
    steps:
      - id: changes
        uses: frasermolyneux/actions/detect-changes@f335f9f14d0062304978193d016f4a43a2e797f4 # detect-changes/v3.0.0
        with:
          filters: |
            src:src/**
            terraform:terraform/**

  build-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.src == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: frasermolyneux/actions/dotnet-ci@a6e30cdad5013f520dfbef81d10c3bdf737aa47e # dotnet-ci/v2.2.0
        with:
          test-reporting: "true"
          dotnet-version: |
            9.0.x
            10.0.x
          src-folder: "src"
          format-target: "MX.GeoLocation.slnx"

      - uses: frasermolyneux/actions/dotnet-playwright-tests@a6271c58ed8e8f3b6fbdb738ac7566863fdc38c8 # dotnet-playwright-tests/v1.2.2
        with:
          test-reporting: "true"
          test-project: "MX.GeoLocation.Web.IntegrationTests"
          src-folder: "src"

  terraform-plan-dev:
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: Development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
    concurrency:
      group: ${{ github.repository }}-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: frasermolyneux/actions/terraform-plan@977ddbedf7f5c6e2fae98ff1d6ec6a9c7669d778 # terraform-plan/v6.0.0
        with:
          perform-checkout: "false"
          terraform-folder: "terraform"
          terraform-var-file: "tfvars/dev.tfvars"
          terraform-backend-file: "backends/dev.backend.hcl"
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
