name: Destroy Development

on:
  workflow_dispatch:
  schedule:
    - cron: "25 23 * * *"

permissions: {}

jobs:
  terraform-destroy-dev:
    permissions:
      contents: read
      id-token: write
    environment: Development
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.repository }}-dev

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Azure Login
      uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - id: gcp-auth
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_wrapper: false

    - name: Terraform Init
      shell: bash
      run: |
        cd terraform
        terraform init -backend-config=backends/dev.backend.hcl -var-file=tfvars/dev.tfvars
      env:
        ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        ARM_USE_AZUREAD: true
        ARM_USE_OIDC: true

    - name: Delete externally managed APIM APIs
      shell: bash
      run: |
        set -euo pipefail
        cd terraform
        OUTPUTS=$(terraform output -json)
        APIM_NAME=$(jq -r '.api_management_name.value // empty' <<<"$OUTPUTS")
        APIM_RG=$(jq -r '.api_management_resource_group_name.value // empty' <<<"$OUTPUTS")

        if [ -n "$APIM_NAME" ] && [ -n "$APIM_RG" ]; then
          echo "Deleting APIM APIs from $APIM_NAME in $APIM_RG..."
          for API_ID in geolocation-api-v1 geolocation-api-v1-1; do
            EXISTING_API=$(az apim api list --resource-group "$APIM_RG" --service-name "$APIM_NAME" --query "[?name == '$API_ID'].name | [0]" --output tsv)
            if [ -n "$EXISTING_API" ]; then
              az apim api delete --resource-group "$APIM_RG" --service-name "$APIM_NAME" --api-id "$API_ID" --delete-revisions true --yes
            else
              echo "APIM API $API_ID is already absent"
            fi
          done
        elif [ -n "$APIM_NAME" ] || [ -n "$APIM_RG" ]; then
          echo "::error::Terraform returned incomplete APIM outputs"
          exit 1
        else
          echo "No APIM outputs exist; cleanup is not required"
        fi
      env:
        ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        ARM_USE_AZUREAD: true
        ARM_USE_OIDC: true

    - uses: frasermolyneux/actions/terraform-destroy@terraform-destroy/v1.3
      with:
        terraform-folder: "terraform"
        terraform-var-file: "tfvars/dev.tfvars"
        terraform-backend-file: "backends/dev.backend.hcl"
        AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        perform-checkout: "false"

    - name: Remove automatically recreated Failure Anomalies rule
      shell: bash
      run: |
        set -euo pipefail
        SMART_DETECTOR_ID="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-geo-location-dev-swedencentral/providers/Microsoft.AlertsManagement/smartDetectorAlertRules/Failure Anomalies - ai-geo-location-dev-swedencentral"

        if az resource show --ids "$SMART_DETECTOR_ID" --api-version 2021-04-01 --only-show-errors >/dev/null 2>&1; then
          echo "Deleting $SMART_DETECTOR_ID"
          az resource delete --ids "$SMART_DETECTOR_ID" --api-version 2021-04-01 --only-show-errors
        fi

    - name: Assert development resource group is empty
      shell: bash
      run: |
        set -euo pipefail
        RESOURCE_GROUP="rg-geo-location-dev-swedencentral"
        SERVICE_PLAN_ID="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Web/serverfarms/asp-geo-location-dev-swedencentral-default"

        for ATTEMPT in {1..6}; do
          REMAINING_IDS=$(az resource list --resource-group "$RESOURCE_GROUP" --query "[].id" --output tsv --only-show-errors)
          SERVICE_PLAN_EXISTS=false

          if az resource show --ids "$SERVICE_PLAN_ID" --only-show-errors >/dev/null 2>&1; then
            SERVICE_PLAN_EXISTS=true
          fi

          if [ -z "$REMAINING_IDS" ] && [ "$SERVICE_PLAN_EXISTS" = false ]; then
            echo "$RESOURCE_GROUP is empty and the owned development App Service plan is absent"
            exit 0
          fi

          if [ "$ATTEMPT" -lt 6 ]; then
            echo "Resources remain after destroy; retrying inventory assertion in 10 seconds"
            sleep 10
          fi
        done

        echo "::error::Development destroy left Azure resources behind"
        if [ -n "$REMAINING_IDS" ]; then
          echo "Remaining resource IDs:"
          printf '%s\n' "$REMAINING_IDS"
        fi
        if [ "$SERVICE_PLAN_EXISTS" = true ] && ! grep -Fqx "$SERVICE_PLAN_ID" <<<"$REMAINING_IDS"; then
          echo "$SERVICE_PLAN_ID"
        fi
        exit 1
